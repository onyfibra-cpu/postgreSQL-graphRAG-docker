# Compose portátil derivado do docker-compose.yaml original.
# Diferenças: build a partir do Dockerfile local, caminhos relativos,
# healthcheck no Postgres, volume do banco só no serviço postgres,
# porta do banco apenas em loopback, profiles para separar as etapas.
#
# Uso:
#   cp .env-sample .env && editar
#   docker compose -f docker-compose.portable.yaml build
#   docker compose -f docker-compose.portable.yaml up -d postgres
#   docker compose -f docker-compose.portable.yaml --profile index run --rm load-data
#   docker compose -f docker-compose.portable.yaml --profile index run --rm graphrag-index
#   docker compose -f docker-compose.portable.yaml --profile index run --rm graphrag-writer
#   docker compose -f docker-compose.portable.yaml --profile index run --rm build-graph
#   docker compose -f docker-compose.portable.yaml --profile serve up -d mcp-server
#
# Ainda NÃO é produção: o MCP continua sem autenticação (ver docs/01-analise-tecnica-e-seguranca.md).

x-app-base: &app-base
  image: ${GRAPHRAG_IMAGE:-graphrag-age:local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  volumes:
    - graphrag_data:/app/graphrag-folder
    - ./settings.yaml:/app/graphrag-folder/settings.yaml:ro
    - ./data/prompts:/app/graphrag-folder/prompts:ro

services:
  postgres:
    image: ${GRAPHRAG_IMAGE:-graphrag-age:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag-postgres
    environment:
      USE_LOCAL_AGE: ${USE_LOCAL_AGE:-true}
      POSTGRES_USER: ${AGE_USER:?defina AGE_USER no .env}
      POSTGRES_PASSWORD: ${AGE_PASSWORD:?defina AGE_PASSWORD no .env}
      POSTGRES_DB: ${AGE_DB:-postgres}
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  load-data:
    <<: *app-base
    profiles: ["index"]
    container_name: graphrag-load-data
    volumes:
      - graphrag_data:/app/graphrag-folder
      - ./load-data.py:/app/load-data.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 /app/load-data.py

  graphrag-index:
    <<: *app-base
    profiles: ["index"]
    container_name: graphrag-index
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "echo \"Total files: $$(find /app/graphrag-folder/input -type f | wc -l)\" &&
             graphrag index --root /app/graphrag-folder"

  graphrag-writer:
    <<: *app-base
    profiles: ["index"]
    container_name: graphrag-writer
    volumes:
      - graphrag_data:/app/graphrag-folder
      - ./write-to-db.py:/app/write-to-db.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 /app/write-to-db.py

  build-graph:
    <<: *app-base
    profiles: ["index"]
    container_name: graphrag-build-graph
    volumes:
      - graphrag_data:/app/graphrag-folder
      - ./build-graph.py:/app/build-graph.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 /app/build-graph.py

  reconstruct-graph:
    <<: *app-base
    profiles: ["restore"]
    container_name: graphrag-reconstruct
    volumes:
      - graphrag_data:/app/graphrag-folder
      - ./reconstruct-graph.py:/app/reconstruct-graph.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 /app/reconstruct-graph.py

  mcp-server:
    <<: *app-base
    profiles: ["serve"]
    container_name: graphrag-mcp
    volumes:
      - graphrag_data:/app/graphrag-folder
      - ./settings.yaml:/app/graphrag-folder/settings.yaml:ro
      - ./data/prompts:/app/graphrag-folder/prompts:ro
      - ./mcp_server.py:/app/mcp_server.py:ro
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8011}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: python3 /app/mcp_server.py

  # Notebooks só para desenvolvimento. Nunca subir em produção.
  notebooks:
    <<: *app-base
    profiles: ["dev"]
    container_name: graphrag-notebooks
    volumes:
      - graphrag_data:/app/graphrag-folder
      - ./settings.yaml:/app/graphrag-folder/settings.yaml:ro
      - ./data/prompts:/app/graphrag-folder/prompts:ro
      - ./query-notebook.ipynb:/app/query-notebook.ipynb
      - ./agent-notebook.ipynb:/app/agent-notebook.ipynb
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      jupyter notebook /app --ip=0.0.0.0 --port=8888 --no-browser --allow-root
      --ServerApp.token=$${JUPYTER_TOKEN:?defina JUPYTER_TOKEN}

volumes:
  local_postgres_data:
  graphrag_data:
