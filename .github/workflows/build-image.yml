name: Build and smoke-test GraphRAG+AGE image

on:
  workflow_dispatch:
  push:
    branches: [claude/beautiful-archimedes-t5w3c8]
    paths:
      - "project_folder/Dockerfile"
      - "project_folder/graphRAG/requirements.txt"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/graphrag-age

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally)
        uses: docker/build-push-action@v6
        with:
          context: project_folder
          file: project_folder/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - Python stack
        run: |
          docker run --rm ${IMAGE}:${{ github.sha }} bash -c '
            set -e
            python3 --version
            python3 -c "from importlib.metadata import version; print(\"graphrag\", version(\"graphrag\"))"
            graphrag --help >/dev/null
            python3 -c "import graphrag, mcp, psycopg2, pgvector, pandas, pyarrow; print(\"python imports ok\")"
            python3 -c "import agent_framework; print(\"agent_framework\", getattr(agent_framework, \"__version__\", \"?\"))"
          '

      - name: Smoke test - Postgres + AGE + pgvector
        run: |
          docker run -d --name pg -e POSTGRES_USER=age -e POSTGRES_PASSWORD=age -e POSTGRES_DB=postgres ${IMAGE}:${{ github.sha }}
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U age -d postgres && break
            sleep 2
          done
          docker exec pg psql -U age -d postgres -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS age;" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker exec pg psql -U age -d postgres -v ON_ERROR_STOP=1 -c "LOAD 'age'; SET search_path = ag_catalog, public; SELECT create_graph('smoke'); SELECT * FROM cypher('smoke', \$\$ CREATE (n:Entity {name:'x'}) RETURN n \$\$) AS (n agtype);"
          docker exec pg psql -U age -d postgres -v ON_ERROR_STOP=1 -c "SELECT '[1,2,3]'::vector <-> '[1,2,4]'::vector AS l2;"
          docker exec pg psql -U age -d postgres -c "SELECT extname, extversion FROM pg_extension ORDER BY 1;"
          docker rm -f pg

      - name: Image size
        run: |
          docker image inspect ${IMAGE}:${{ github.sha }} --format '{{.Size}}' | awk '{printf "image size: %.2f GB\n", $1/1024/1024/1024}'

      - name: Push image to GHCR
        run: |
          docker tag ${IMAGE}:${{ github.sha }} ${IMAGE}:latest
          docker push ${IMAGE}:${{ github.sha }}
          docker push ${IMAGE}:latest
